name: Paynux Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Release APK
        run: |
          ./gradlew --no-daemon \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/36.0.0/aapt2" \
            :app:assembleRelease \
            -x lintVitalRelease

      - name: Sign APK
        env:
          PAYNUX_KEYSTORE_BASE64: ${{ secrets.PAYNUX_KEYSTORE_BASE64 }}
          PAYNUX_KEYSTORE_PASSWORD: ${{ secrets.PAYNUX_KEYSTORE_PASSWORD }}
          PAYNUX_KEY_ALIAS: ${{ secrets.PAYNUX_KEY_ALIAS }}
          PAYNUX_KEY_PASSWORD: ${{ secrets.PAYNUX_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$PAYNUX_KEYSTORE_BASE64"
          printf '%s' "$PAYNUX_KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/paynux.jks"

          APK="$(find app/build/outputs/apk/release \
            -type f -name '*.apk' | head -n 1)"
          test -n "$APK"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/paynux.jks" \
            --ks-key-alias "$PAYNUX_KEY_ALIAS" \
            --ks-pass env:PAYNUX_KEYSTORE_PASSWORD \
            --key-pass env:PAYNUX_KEY_PASSWORD \
            --out "$RUNNER_TEMP/Paynux-${GITHUB_REF_NAME}.apk" \
            "$APK"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --verbose "$RUNNER_TEMP/Paynux-${GITHUB_REF_NAME}.apk"

          sha256sum "$RUNNER_TEMP/Paynux-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Paynux ${{ github.ref_name }}
          generate_release_notes: true
          files: ${{ runner.temp }}/Paynux-${{ github.ref_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
