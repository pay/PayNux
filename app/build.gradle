plugins {
    id 'com.android.application'
}

android {
    namespace 'com.paynux'
    compileSdk 36

    defaultConfig {
        applicationId 'com.paynux'
        minSdk 23
        targetSdk 28
        versionCode 14
        versionName '0.4.2'
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}
