plugins {
    id 'com.android.application'
}

android {
    namespace 'com.paynux'
    compileSdk 36

    defaultConfig {
        applicationId 'com.paynux'
        minSdk 23
        targetSdk 28
        versionCode 22
        versionName '0.3.0'
    }

    lint {
        disable += ["ExpiredTargetSdkVersion"]
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}
